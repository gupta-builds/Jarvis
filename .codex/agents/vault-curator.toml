# vault-curator\r
\r
---\r
\r
## When to Use\r
\r
Invoke this agent when:\r
\r
- You want a health check on the entire vault (not just `60_Claude/`)\r
- Notes feel messy or disorganized\r
- You suspect duplicates or orphan pages\r
- After a large ingestion session\r
- Monthly or quarterly maintenance\r
\r
---\r
\r
## Operating Instructions\r
\r
Before scanning or editing, read:\r
\r
- `60_Claude/07_AI_Information/Vault Map.md`\r
- `AGENTS.md` (the Write Contract you are enforcing)\r
- `40_Resources/Obsidian/Jarvis Vault Architecture.md`\r
- `60_Claude/07_AI_Information/AI_CONTEXT.md`\r
- `HUMAN_WRITING.md`\r
- `40_Resources/Obsidian/Vault Operating System.md`\r
\r
### 0. Check Latest Ops Report\r
\r
Before scanning, search for the most recent note tagged `ops-health` (by `created` date). Read it. Use its findings to skip issues the daily Health Check already caught. Focus curator effort on what daily ops misses: deep structural problems, cross-folder duplication, and long-term link graph health.\r
\r
### 1. Full Vault Scan\r
\r
Read structure across all folders:\r
\r
- `10_Areas/` — Identity hubs + current-term coursework (check hubs link out; do not bloat)\r
- `20_Progress/` — Active projects (check for stalled, missing `next:`)\r
- `30_Order/` — Templates, Standards, Workflows, System tooling (flag anything that isn't one of those four — it's misfiled)\r
- `40_Resources/` — Reference knowledge, including past-course material under `40_Resources/UMN/` (check for gaps, uncurated bulk dumps)\r
- `60_Claude/` — AI workshop (full lint; flag mature `20_Distilled_Notes` ready to promote)\r
- `60_Claude/00_Inbox/` — Unprocessed items\r
- `50_Archive/` — **Never read.** Excluded by the Write Contract; skip entirely.\r
\r
### 2. Check Categories\r
\r
**Link Health:**\r
- Build graph of all `[[links]]`\r
- Identify broken links (notes that don't exist)\r
- Identify orphans (no inbound links)\r
- Identify hubs (many inbound links — are they useful?)\r
\r
**Duplication:**\r
- Search for similar titles\r
- Compare content overlap\r
- Flag potential merges\r
- When a duplicate pair includes one note with Capability Engine fields (`track`, `mastery_level`, `evidence`) and one without: prefer preserving the enriched version, suggest linking the non-enriched note to it rather than merging. If both notes are enriched, flag for manual review.\r
\r
**Frontmatter Health:**\r
- Notes missing `type:`\r
- Notes missing `tags:`\r
- Notes missing `created:`\r
- Inconsistent `status:` values\r
\r
**Project Health:**\r
- Projects with no `next:` action\r
- Projects unchanged for 30+ days\r
- Projects with `status: seed` that should be archived\r
\r
**Write Contract enforcement (per AGENTS.md):**\r
- Any file at the vault root that is not one of the four contract files (`00_Dashboard.md`, `AGENTS.md`, `AGENTS.md`, `HUMAN_WRITING.md`) — flag to move\r
- Anything in `30_Order/` that is not a template, workflow, or tool — flag as misfiled\r
- Any `10_Areas/` file that looks like active project work — belongs in `20_Progress/`\r
- Bulk AI distillations sitting in `40_Resources/` without backlinks — flag the curation breach\r
- Mature `60_Claude/20_Distilled_Notes/` concepts (`status: tree`, reused) — flag for promotion per [[Promotion]]\r
\r
### 3. Create Curator Report\r
\r
Create `60_Claude/30_Reviews/Vault Curator Report - YYYY-MM-DD.md`:\r
\r
```markdown\r
---\r
type: review\r
status: complete\r
created: YYYY-MM-DD\r
tags:\r
  - lint\r
  - vault-health\r
notes:\r
  - "[[Codex Board]]"\r
  - "[[AGENTS.md]]"\r
---\r
\r
# Vault Curator Report\r
\r
## Summary\r
\r
| Area | Health | Issues |\r
|------|--------|--------|\r
| 00_Inbox | ⚠️ | X unprocessed |\r
| 20_Progress | ✅ | Y stalled |\r
| 40_Resources | ✅ | Z gaps |\r
| 60_Claude | ⚠️ | See lint report |\r
| 10_Areas | ✅ | — |\r
\r
## Broken Links\r
\r
| Source | Broken Link | Should Point To |\r
|--------|-------------|-----------------|\r
| [[Note A]] | [[Nonexistent]] | [[Real Note]] or remove |\r
\r
## Orphan Notes\r
\r
| Note | Folder | Suggested Parent |\r
|------|--------|------------------|\r
| [[Note]] | 40_Resources/ | [[Hub Note]] |\r
\r
## Potential Duplicates\r
\r
| Note A | Note B | Confidence | Action |\r
|--------|--------|------------|--------|\r
| [[A]] | [[B]] | High | Merge suggested |\r
\r
## Stalled Projects\r
\r
| Project | Last Modified | Missing |\r
|---------|---------------|---------|\r
| [[Project]] | YYYY-MM-DD | `next:` action |\r
\r
## Frontmatter Issues\r
\r
| Note | Missing | Fix |\r
|------|---------|-----|\r
| [[Note]] | `type:`, `tags:` | Add convention |\r
\r
## Capability Engine Maintenance\r
\r
| Issue | Note | Details |\r
|-------|------|---------|\r
| Conflicting property type | [[Note]] | `track` is string, expected list |\r
| Stale track | ai | No enriched notes in 30+ days |\r
| Broken concept link | [[Synthesis Note]] | [[Missing Concept]] not found |\r
\r
Checks:\r
- Notes where the same property (`track`, `mastery_level`, etc.) has conflicting types across the vault (string in one note, list in another)\r
- Tracks with no enriched notes in 30 days — the track exists but nothing in it has been updated or drilled recently\r
- Synthesis notes with `concepts:` fields pointing to notes that don't exist\r
\r
## Recommended Actions\r
\r
### Immediate\r
\r
1. Fix broken links\r
2. Add `next:` actions to stalled projects\r
3. Process inbox items\r
\r
### This Week\r
\r
4. Merge duplicate pairs\r
5. Create missing concept pages\r
6. Update orphan notes with links\r
\r
### This Month\r
\r
7. Archive completed projects\r
8. Standardize frontmatter\r
9. Review and update hub pages\r
\r
