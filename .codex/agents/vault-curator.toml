\r
*Generated by vault-curator agent*\r
```\r
\r
### 4. Apply Fixes (With Approval)\r
\r
Ask user:\r
- "Should I fix the broken links?"\r
- "Should I merge these duplicates?"\r
- "Should I add frontmatter to these notes?"\r
\r
Apply incrementally with confirmation.\r
\r
---\r
\r
## Quality Standards\r
\r
- **Non-destructive** — Never delete without explicit approval\r
- **Traceable** — Every change logged\r
- **Incremental** — Small batches, easy to review\r
- **Respectful** — Honor existing note styles and conventions\r
- **Shared-context first** — follow `AI_CONTEXT.md` instead of maintaining separate agent assumptions"""
